# This tmux statusbar config was created by tmuxline.vim
# on Mon, 11 Sep 2017

set -g status-justify "left"
set -g status "on"
# set -g status-attr "none"
set -g message-command-style bg="colour240"
set -g status-left-length "100"
set -g pane-active-border-style fg="colour148"
set -g status-bg "colour236"
set -g message-command-style fg="colour231"
set -g pane-border-style fg="colour240"
set -g message-style bg=colour240,fg=colour231
# set -g status-left-attr "none"
# set -g status-right-attr "none"
set -g status-right-length "100"
setw -g window-status-style fg=colour245,bg=colour236
setw -g window-status-activity-style bg=colour236,fg=colour217
# setw -g window-status-attr "none"
# setw -g window-status-activity-attr "none"
setw -g window-status-separator ""
set -g status-left "\
#[fg=colour236,bg=colour148,bold] #S \
#[fg=colour148,bg=colour236,nobold,nounderscore,noitalics]"
set -g status-right "\
#[fg=colour239,bg=colour236,nobold,nounderscore,noitalics]\
#[fg=colour250,bg=colour239] #(cat /proc/loadavg | cut -d ' ' -f1,2,3) \
#[fg=colour240,bg=colour239]\
#[fg=colour250,bg=colour240] #(free -m | awk '/Mem:/ {printf \"%.1fG/%.1fG\", $3/1024, $2/1024}') \
#[fg=colour241,bg=colour240]\
#[fg=colour250,bg=colour241] %m/%d %H:%M:%S \
#[fg=colour252,bg=colour241,nobold,nounderscore,noitalics]\
#[fg=colour241,bg=colour252] #h "
